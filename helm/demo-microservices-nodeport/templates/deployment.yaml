{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $svc.image }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}

          ports:
            - name: http
              containerPort: {{ $svc.port }}

          # Environment variables
          {{- if $svc.env }}
          env:
            {{- range $svc.env }}
            - name: {{ .name }}
              {{- if hasKey . "value" }}
              value: {{ tpl .value $ | quote }}
              {{- else if hasKey . "valueFrom" }}
              valueFrom:
                {{ toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
          {{- end }}

          # READINESS PROBE
          readinessProbe:
            httpGet:
              path: {{ coalesce $svc.readinessPath $svc.healthPath "/actuator/health/readiness" }}
              port: {{ $svc.port }}
            initialDelaySeconds: {{ $svc.readinessInitialDelaySeconds | default 20 }}
            periodSeconds: {{ $svc.readinessPeriodSeconds | default 10 }}
            timeoutSeconds: {{ $svc.readinessTimeoutSeconds | default 3 }}
            failureThreshold: {{ $svc.readinessFailureThreshold | default 10 }}

          # LIVENESS PROBE
          livenessProbe:
            httpGet:
              path: {{ coalesce $svc.livenessPath $svc.healthPath "/actuator/health/liveness" }}
              port: {{ $svc.port }}
            initialDelaySeconds: {{ $svc.livenessInitialDelaySeconds | default 30 }}
            periodSeconds: {{ $svc.livenessPeriodSeconds | default 10 }}
            timeoutSeconds: {{ $svc.livenessTimeoutSeconds | default 3 }}
            failureThreshold: {{ $svc.livenessFailureThreshold | default 5 }}

          # Resources
          resources:
            {{- if $svc.resources }}
            {{ toYaml $svc.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
            {{- end }}
---
{{- end }}