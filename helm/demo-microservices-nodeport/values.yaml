global:
  imagePullPolicy: IfNotPresent
  eurekaUrl: "http://demo-eureka-service:8761/eureka/"

services:

  ###########################################################################
  # EUREKA
  ###########################################################################
  demo-eureka-service:
    image: "ghcr.io/gmarino/demo-eureka/demo-eureka:latest"
    replicaCount: 1
    serviceType: LoadBalancer

    port: 8761
    servicePort: 8761
    nodePort: 30761

    healthPath: "/actuator/health"

    readinessInitialDelaySeconds: 60
    livenessInitialDelaySeconds: 90
    readinessPeriodSeconds: 10
    livenessPeriodSeconds: 10
    readinessFailureThreshold: 30
    livenessFailureThreshold: 30

    env:
      - name: SERVER_ADDRESS
        value: "0.0.0.0"


  ###########################################################################
  # GATEWAY (un solo path comune → bilanciamento A+B via Eureka)
  ###########################################################################
  demo-gateway-service:
    image: "ghcr.io/gmarino/demo-gateway/demo-gateway:latest"
    replicaCount: 1

    port: 8765
    servicePort: 8765
    nodePort: 30765

    readinessPath: "/actuator/health/readiness"
    livenessPath: "/actuator/health/liveness"

    readinessInitialDelaySeconds: 60
    livenessInitialDelaySeconds: 90
    readinessPeriodSeconds: 10
    livenessPeriodSeconds: 10
    readinessFailureThreshold: 30
    livenessFailureThreshold: 30

    env:
      # Connessione a Eureka
      - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: "http://demo-eureka-service:8761/eureka/"

      - name: SPRING_APPLICATION_NAME
        value: "demo-gateway-service"

      # ROUTE UNICA → path comune
      - name: SPRING_CLOUD_GATEWAY_ROUTES_0_ID
        value: "demo-services-group"
      - name: SPRING_CLOUD_GATEWAY_ROUTES_0_URI
        value: "lb://demo-services-group"
      - name: SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0
        value: "Path=/demo/api/pingctrl/**"
      - name: SPRING_CLOUD_GATEWAY_ROUTES_0_FILTERS_0
        value: "StripPrefix=2"

      # INFO Eureka
      - name: EUREKA_INSTANCE_HOSTNAME
        value: "demo-gateway-service"
      - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
        value: "false"
      - name: EUREKA_INSTANCE_NON_SECURE_PORT
        value: "8765"
      - name: EUREKA_INSTANCE_INSTANCE_ID
        value: "demo-gateway-service"


  ###########################################################################
  # SERVICE A (parte del gruppo demo-services-group)
  ###########################################################################
  demo-service-a:
    image: "ghcr.io/gmarino/demo/demo:latest"
    replicaCount: 1
    serviceType: LoadBalancer

    port: 8080
    servicePort: 8080
    nodePort: 30766

    healthPath: "/actuator/health"

    readinessInitialDelaySeconds: 60
    livenessInitialDelaySeconds: 90
    readinessPeriodSeconds: 10
    livenessPeriodSeconds: 10
    readinessFailureThreshold: 30
    livenessFailureThreshold: 30

    env:
      - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: "http://demo-eureka-service:8761/eureka/"
      - name: SPRING_APPLICATION_NAME
        value: "demo-services-group"     # <── nome unificato
      - name: EUREKA_INSTANCE_HOSTNAME
        value: "demo-service-a"
      - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
        value: "false"
      - name: EUREKA_INSTANCE_NON_SECURE_PORT
        value: "8080"
      - name: EUREKA_INSTANCE_INSTANCE_ID
        value: "demo-services-group-a"
      - name: SERVER_ADDRESS
        value: "0.0.0.0"


  ###########################################################################
  # SERVICE B (parte del gruppo demo-services-group)
  ###########################################################################
  demo-service-b:
    image: "ghcr.io/gmarino/demo/demo:latest"
    replicaCount: 1
    serviceType: LoadBalancer

    port: 8080
    servicePort: 8080
    nodePort: 30768

    healthPath: "/actuator/health"

    readinessInitialDelaySeconds: 60
    livenessInitialDelaySeconds: 90
    readinessPeriodSeconds: 10
    livenessPeriodSeconds: 10
    readinessFailureThreshold: 30
    livenessFailureThreshold: 30

    env:
      - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: "http://demo-eureka-service:8761/eureka/"
      - name: SPRING_APPLICATION_NAME
        value: "demo-services-group"     # <── nome unificato
      - name: EUREKA_INSTANCE_HOSTNAME
        value: "demo-service-b"
      - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
        value: "false"
      - name: EUREKA_INSTANCE_NON_SECURE_PORT
        value: "8080"
      - name: EUREKA_INSTANCE_INSTANCE_ID
        value: "demo-services-group-b"
      - name: SERVER_ADDRESS
        value: "0.0.0.0"
